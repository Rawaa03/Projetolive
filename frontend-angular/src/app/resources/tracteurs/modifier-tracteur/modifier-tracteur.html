<div class="container mt-5">
  <div *ngIf="loadingData" class="text-center">
    <p>Chargement des données...</p>
  </div>

  <div *ngIf="!loadingData" class="form-container">
    <h2 class="title mb-4">Modifier le Tracteur #{{ tracteur?.id }}</h2>

    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <div *ngIf="success" class="alert alert-success">Tracteur mis à jour avec succès!</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-6">
          <mat-form-field class="w-100 mb-3">
            <mat-label>Marque</mat-label>
            <input matInput formControlName="marque">
          </mat-form-field>
        </div>

        <div class="col-md-6">
          <mat-form-field class="w-100 mb-3">
            <mat-label>Modèle</mat-label>
            <input matInput formControlName="modele">
          </mat-form-field>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <mat-form-field class="w-100 mb-3">
            <mat-label>Année</mat-label>
            <input matInput type="number" formControlName="annee">
          </mat-form-field>
        </div>

        <div class="col-md-6">
          <mat-form-field class="w-100 mb-3">
            <mat-label>Puissance Moteur (CV)</mat-label>
            <input matInput type="number" formControlName="puissanceMoteur">
          </mat-form-field>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <mat-form-field class="w-100 mb-3">
            <mat-label>Type de Carburant</mat-label>
            <mat-select formControlName="typeCarburant">
              <mat-option *ngFor="let carb of carburantOptions" [value]="carb.value">
                {{ carb.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="col-md-6">
          <mat-form-field class="w-100 mb-3">
            <mat-label>Consommation (L/h)</mat-label>
            <input matInput type="number" formControlName="consommationCarburant">
          </mat-form-field>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <mat-form-field class="w-100 mb-3">
            <mat-label>Kilométrage</mat-label>
            <input matInput type="number" formControlName="kilometrage">
          </mat-form-field>
        </div>

        <div class="col-md-6">
          <mat-form-field class="w-100 mb-3">
            <mat-label>Couleur</mat-label>
            <input matInput formControlName="couleur">
          </mat-form-field>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <mat-form-field class="w-100 mb-3">
            <mat-label>Statut</mat-label>
            <mat-select formControlName="statut">
              <mat-option *ngFor="let stat of statutOptions" [value]="stat.value">
                {{ stat.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="col-12 mb-3">
          <label>
            <mat-checkbox formControlName="remorqueAttachee"></mat-checkbox>
            Remorque Attachée
          </label>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <mat-form-field class="w-100 mb-3">
            <mat-label>Description</mat-label>
            <textarea matInput rows="4" formControlName="description"></textarea>
          </mat-form-field>
        </div>
      </div>

      <div class="action-buttons">
        <button mat-raised-button 
                color="primary" 
                type="submit"
                [disabled]="loading || form.invalid">
          <mat-icon *ngIf="!loading">check</mat-icon>
          {{ loading ? 'Mise à jour en cours...' : 'Mettre à jour' }}
        </button>
        <button mat-raised-button 
                type="button"
                (click)="cancel()"
                [disabled]="loading">
          <mat-icon>close</mat-icon>
          Annuler
        </button>
      </div>
    </form>
  </div>
</div>
