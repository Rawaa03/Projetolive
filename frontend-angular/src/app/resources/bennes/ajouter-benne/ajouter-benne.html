<div class="container mt-5">
  <div class="form-container">
    <h2 class="title mb-4">Ajouter une Nouvelle Benne</h2>

    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <div *ngIf="success" class="alert alert-success">Benne créée avec succès!</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-6">
          <mat-form-field class="w-100 mb-3">
            <mat-label>Capacité Maximale (kg)</mat-label>
            <input matInput 
                   type="number" 
                   formControlName="capaciteMax"
                   placeholder="Ex: 5000">
            <mat-error *ngIf="form.get('capaciteMax')?.hasError('required')">
              La capacité est requise
            </mat-error>
            <mat-error *ngIf="form.get('capaciteMax')?.hasError('min')">
              La capacité doit être au minimum 100 kg
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-md-6">
          <mat-form-field class="w-100 mb-3">
            <mat-label>Type de Matériau</mat-label>
            <mat-select formControlName="typeMateriau">
              <mat-option *ngFor="let mat of materiauxOptions" [value]="mat.value">
                {{ mat.label }}
              </mat-option>
            </mat-select>
            <mat-error *ngIf="form.get('typeMateriau')?.hasError('required')">
              Le type de matériau est requis
            </mat-error>
          </mat-form-field>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <mat-form-field class="w-100 mb-3">
            <mat-label>Usure (%)</mat-label>
            <input matInput 
                   type="number" 
                   formControlName="usure"
                   placeholder="0-100"
                   min="0"
                   max="100">
            <mat-error *ngIf="form.get('usure')?.hasError('required')">
              L'usure est requise
            </mat-error>
            <mat-error *ngIf="form.get('usure')?.hasError('min') || form.get('usure')?.hasError('max')">
              L'usure doit être entre 0 et 100
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-md-6">
          <mat-form-field class="w-100 mb-3">
            <mat-label>Couleur</mat-label>
            <input matInput 
                   type="text" 
                   formControlName="couleur"
                   placeholder="Ex: Rouge">
          </mat-form-field>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <mat-form-field class="w-100 mb-3">
            <mat-label>Description</mat-label>
            <textarea matInput 
                      formControlName="description"
                      rows="4"
                      placeholder="Description optionnelle"></textarea>
          </mat-form-field>
        </div>
      </div>

      <div class="action-buttons">
        <button mat-raised-button 
                color="primary" 
                type="submit"
                [disabled]="loading || form.invalid">
          <mat-icon *ngIf="!loading">check</mat-icon>
          {{ loading ? 'Création en cours...' : 'Créer la Benne' }}
        </button>
        <button mat-raised-button 
                type="button"
                (click)="cancel()"
                [disabled]="loading">
          <mat-icon>close</mat-icon>
          Annuler
        </button>
      </div>
    </form>
  </div>
</div>
