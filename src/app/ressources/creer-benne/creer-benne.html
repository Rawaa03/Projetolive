<div class="container">
  <div class="header">
    <h1>{{ isEditing ? 'Modifier' : 'Ajouter' }} une Benne</h1>
    <button class="btn btn-secondary" (click)="goBack()">Retour</button>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>

  <div *ngIf="loading && isEditing" class="loading">
    Chargement...
  </div>

  <form (ngSubmit)="onSubmit()" class="form">
    <div class="form-group">
      <label for="type">Type de Benne *</label>
      <input
        type="text"
        id="type"
        [(ngModel)]="benne.type"
        name="type"
        placeholder="Ex: Benne à ordures"
        required
      />
    </div>

    <div class="form-group">
      <label for="statut">Statut</label>
      <select id="statut" [(ngModel)]="benne.statut" name="statut">
        <option value="disponible">Disponible</option>
        <option value="en_utilisation">En utilisation</option>
        <option value="maintenance">Maintenance</option>
        <option value="hors_service">Hors service</option>
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="capacite">Capacité (kg) *</label>
        <input
          type="number"
          id="capacite"
          [(ngModel)]="benne.capacite"
          name="capacite"
          min="0"
          required
        />
      </div>

      <div class="form-group">
        <label for="poids">Poids Actuel (kg)</label>
        <input
          type="number"
          id="poids"
          [(ngModel)]="benne.poids_actuel"
          name="poids_actuel"
          min="0"
        />
      </div>
    </div>

    <div class="form-group">
      <label for="usure">Usure</label>
      <select id="usure" [(ngModel)]="benne.usure" name="usure">
        <option value="">Sélectionner</option>
        <option value="faible">Faible</option>
        <option value="moyen">Moyen</option>
        <option value="élevé">Élevé</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{ loading ? 'Veuillez patienter...' : (isEditing ? 'Modifier' : 'Créer') }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="goBack()">
        Annuler
      </button>
    </div>
  </form>
</div>
