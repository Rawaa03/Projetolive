<!-- src/app/ressources/bennes/ajouter-benne/ajouter-benne.html -->
<div class="app-layout">

  <!-- Sidebar Component -->
  <app-sidebar
    [isCollapsed]="isSidebarCollapsed"
    (toggleSidebar)="toggleSidebar()"
    [userRole]="userRole">
  </app-sidebar>

  <!-- Main Content -->
  <main class="main-content"
        [class.sidebar-collapsed]="isSidebarCollapsed"
        [class.sidebar-open]="!isSidebarCollapsed">

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-menu-toggle" (click)="toggleSidebar()" *ngIf="isMobile">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M3 12H21M3 6H21M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="oh-scene">

      <!-- Ambient soft orbs -->
      <div class="oh-ambient" aria-hidden="true">
        <div class="amb-orb amb-orb--1"></div>
        <div class="amb-orb amb-orb--2"></div>
        <div class="amb-orb amb-orb--3"></div>
        <div class="amb-stripe"></div>
      </div>

      <!-- Main Premium Card -->
      <div class="oh-card">

        <!-- Glow border -->
        <div class="oh-card__glow" aria-hidden="true"></div>

        <!-- Card Header -->
        <div class="oh-card__header">
          <div class="oh-header__inner">
            <div class="oh-header__left">
              <div class="oh-brand">
                <div class="oh-brand__icon">
                  <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 40C8 40 14 18 32 13C32 13 35 27 24 34C17 38 8 40 8 40Z" fill="#A8B84B" opacity="0.9"/>
                    <path d="M8 40C11 32 16 27 24 25" stroke="#DFE9B0" stroke-width="1.8" stroke-linecap="round"/>
                  </svg>
                </div>
                <div class="oh-brand__rings" aria-hidden="true">
                  <span></span><span></span>
                </div>
              </div>
              <div class="oh-header__text">
                <p class="oh-header__eyebrow">
                  <span class="eyebrow-dash"></span>
                  AJOUT BENNE
                  <span class="eyebrow-dash"></span>
                </p>
                <h2 class="oh-header__title">Créer une nouvelle benne</h2>
                <p class="header-subtitle">Ajoutez un nouveau conteneur de récolte</p>
              </div>
            </div>
          </div>
          <div class="oh-header__rule" aria-hidden="true"></div>
        </div>

        <!-- Card Body -->
        <div class="oh-card__body">

          <!-- Message de succès -->
          <div *ngIf="successMessage" class="oh-success">
            <i class="bi bi-check-circle-fill me-2"></i> {{ successMessage }}
          </div>

          <!-- Message d'erreur -->
          <div *ngIf="errorMessage" class="oh-error">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ errorMessage }}
          </div>

          <form [formGroup]="benneForm" (ngSubmit)="onSubmit()" class="oh-form">

            <!-- Informations de la benne -->
            <div class="form-section">
              <h3 class="section-title">
                <i class="bi bi-box-seam"></i>
                Informations de la benne
              </h3>

              <div class="form-row">
                <!-- Nom -->
                <div class="form-group">
                  <label class="form-label">Nom <span class="required">*</span></label>
                  <input type="text" class="form-control" formControlName="nom"
                         placeholder="Benne 001"
                         [class.is-invalid]="benneForm.get('nom')?.invalid && benneForm.get('nom')?.touched">
                  <div class="invalid-feedback" *ngIf="benneForm.get('nom')?.invalid && benneForm.get('nom')?.touched">
                    <span *ngIf="benneForm.get('nom')?.errors?.['required']">Nom requis</span>
                  </div>
                </div>

                <!-- Immatriculation -->
                <div class="form-group">
                  <label class="form-label">Immatriculation <span class="required">*</span></label>
                  <input type="text" class="form-control" formControlName="immatriculation"
                         placeholder="BEN-001"
                         [class.is-invalid]="benneForm.get('immatriculation')?.invalid && benneForm.get('immatriculation')?.touched">
                  <div class="invalid-feedback" *ngIf="benneForm.get('immatriculation')?.invalid && benneForm.get('immatriculation')?.touched">
                    <span *ngIf="benneForm.get('immatriculation')?.errors?.['required']">Immatriculation requise</span>
                  </div>
                </div>
              </div>

              <div class="form-row">
                <!-- Capacité Kg -->
                <div class="form-group">
                  <label class="form-label">Capacité (kg) <span class="required">*</span></label>
                  <input type="number" class="form-control" formControlName="capaciteKg"
                         placeholder="1000"
                         [class.is-invalid]="benneForm.get('capaciteKg')?.invalid && benneForm.get('capaciteKg')?.touched">
                  <div class="invalid-feedback" *ngIf="benneForm.get('capaciteKg')?.invalid && benneForm.get('capaciteKg')?.touched">
                    <span *ngIf="benneForm.get('capaciteKg')?.errors?.['required']">Capacité requise</span>
                    <span *ngIf="benneForm.get('capaciteKg')?.errors?.['min']">Minimum 100 kg</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Actions -->
            <div class="form-actions">
              <button type="button" class="btn-secondary" (click)="cancel()">
                <i class="bi bi-x-lg"></i>
                Annuler
              </button>
              <button type="submit" class="btn-primary" [disabled]="benneForm.invalid || isLoading">
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                <i class="bi bi-check-lg me-2"></i>
                Ajouter benne
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </main>
</div>
