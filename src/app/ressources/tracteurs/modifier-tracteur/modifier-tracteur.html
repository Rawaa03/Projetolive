<!-- src/app/ressources/tracteurs/modifier-tracteur/modifier-tracteur.html -->
<div class="app-layout">

  <!-- Sidebar Component -->
  <app-sidebar
    [isCollapsed]="isSidebarCollapsed"
    (toggleSidebar)="toggleSidebar()"
    [userRole]="userRole">
  </app-sidebar>

  <!-- Main Content -->
  <main class="main-content"
        [class.sidebar-collapsed]="isSidebarCollapsed"
        [class.sidebar-open]="!isSidebarCollapsed">

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-menu-toggle" (click)="toggleSidebar()" *ngIf="isMobile">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M3 12H21M3 6H21M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="oh-scene">

      <!-- Ambient soft orbs -->
      <div class="oh-ambient" aria-hidden="true">
        <div class="amb-orb amb-orb--1"></div>
        <div class="amb-orb amb-orb--2"></div>
        <div class="amb-orb amb-orb--3"></div>
        <div class="amb-stripe"></div>
      </div>

      <!-- Main Premium Card -->
      <div class="oh-card">

        <!-- Glow border -->
        <div class="oh-card__glow" aria-hidden="true"></div>

        <!-- Card Header -->
        <div class="oh-card__header">
          <div class="oh-header__inner">
            <div class="oh-header__left">
              <div class="oh-brand">
                <div class="oh-brand__icon">
                  <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 40C8 40 14 18 32 13C32 13 35 27 24 34C17 38 8 40 8 40Z" fill="#A8B84B" opacity="0.9"/>
                    <path d="M8 40C11 32 16 27 24 25" stroke="#DFE9B0" stroke-width="1.8" stroke-linecap="round"/>
                  </svg>
                </div>
                <div class="oh-brand__rings" aria-hidden="true">
                  <span></span><span></span>
                </div>
              </div>
              <div class="oh-header__text">
                <p class="oh-header__eyebrow">
                  <span class="eyebrow-dash"></span>
                  MODIFICATION TRACTEUR
                  <span class="eyebrow-dash"></span>
                </p>
                <h2 class="oh-header__title">Modifier le tracteur</h2>
                <p class="header-subtitle">Mettez à jour les informations du tracteur</p>
              </div>
            </div>
          </div>
          <div class="oh-header__rule" aria-hidden="true"></div>
        </div>

        <!-- Card Body -->
        <div class="oh-card__body">

          <!-- Chargement -->
          <div *ngIf="isLoading" class="loading-container">
            <div class="spinner"></div>
            <p>Chargement des informations...</p>
          </div>

          <!-- Message de succès -->
          <div *ngIf="successMessage" class="oh-success">
            <i class="bi bi-check-circle-fill me-2"></i> {{ successMessage }}
          </div>

          <!-- Message d'erreur -->
          <div *ngIf="errorMessage" class="oh-error">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ errorMessage }}
          </div>

          <form *ngIf="!isLoading" [formGroup]="tracteurForm" (ngSubmit)="onSubmit()" class="oh-form">

            <!-- Informations du tracteur -->
            <div class="form-section">
              <h3 class="section-title">
                <i class="bi bi-info-circle"></i>
                Informations du tracteur
              </h3>

              <div class="form-row">
                <!-- Immatriculation (read-only) -->
                <div class="form-group">
                  <label class="form-label">Immatriculation</label>
                  <input type="text" class="form-control" [value]="tracteur?.immatriculation" disabled>
                </div>

                <!-- Nom (read-only) -->
                <div class="form-group">
                  <label class="form-label">Nom</label>
                  <input type="text" class="form-control" [value]="tracteur?.nom" disabled>
                </div>
              </div>

              <div class="form-row">
                <!-- Statut -->
                <div class="form-group">
                  <label class="form-label">Statut <span class="required">*</span></label>
                  <select class="form-control" formControlName="statut"
                          [class.is-invalid]="tracteurForm.get('statut')?.invalid && tracteurForm.get('statut')?.touched">
                    <option value="DISPONIBLE">Disponible</option>
                    <option value="EN_USE">En Usage</option>
                    <option value="MAINTENANCE">Maintenance</option>
                    <option value="HORS_SERVICE">Hors Service</option>
                  </select>
                </div>

                <!-- Remorque attachée (info) -->
                <div class="form-group">
                  <label class="form-label">Remorque attachée</label>
                  <input type="text" class="form-control" [value]="tracteur?.aRemorque ? 'Oui' : 'Non'" disabled>
                </div>
              </div>

              <div class="form-row">
                <!-- Puissance (info) -->
                <div class="form-group">
                  <label class="form-label">Puissance</label>
                  <input type="text" class="form-control" [value]="tracteur?.puissance || '-'" disabled>
                </div>

                <!-- Carburant (info) -->
                <div class="form-group">
                  <label class="form-label">Carburant</label>
                  <input type="text" class="form-control" [value]="tracteur?.carburant || '-'" disabled>
                </div>
              </div>
            </div>

            <!-- Actions -->
            <div class="form-actions">
              <button type="button" class="btn-secondary" (click)="cancel()">
                <i class="bi bi-x-lg"></i>
                Annuler
              </button>
              <button type="submit" class="btn-primary" [disabled]="tracteurForm.invalid || isLoading">
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                <i class="bi bi-check-lg me-2"></i>
                Modifier tracteur
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </main>
</div>
